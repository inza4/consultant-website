<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patricio Inzaghi · IT Consultant</title>
  <!-- Redirect to the correct language version based on the hostname -->
  <script>
    (function () {
      var host = location.hostname;
      // consultant-it.inzaghi.ar → French version
      if (host.includes('consultant-it')) {
        location.replace('fr/');
      } else {
        // Default (it-consultant.inzaghi.ar, localhost, etc.) → English version
        location.replace('en/');
      }
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=en/" />
  </noscript>
</head>
<body>
  <p>
    Redirecting… If nothing happens:
    <a href="en/">English</a> |
    <a href="fr/">Français</a>
  </p>
</body>
</html>
